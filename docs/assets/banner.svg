<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Bakufu</title>
  <desc id="desc">Bakufu, an open-source collectible character card game: a fan of five cards from common to legendary.</desc>
  <defs>
    <clipPath id="frame"><rect width="1280" height="400" rx="28"/></clipPath>
    <radialGradient id="glow-violet" cx="950" cy="210" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c4dff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#7c4dff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-pink" cx="120" cy="420" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-teal" cx="560" cy="-40" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="950" cy="200" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7d27d" stop-opacity="0.50"/>
      <stop offset="1" stop-color="#f7d27d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6c9ff"/>
    </linearGradient>
    <linearGradient id="card-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2030"/>
      <stop offset="1" stop-color="#11121a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- One card face, 160 x 224, drawn around its top-left corner; color comes from currentColor. -->
    <symbol id="card" viewBox="0 0 160 224" overflow="visible">
      <rect x="0" y="0" width="160" height="224" rx="16" fill="url(#card-body)" stroke="currentColor" stroke-width="2.5"/>
      <rect x="12" y="12" width="136" height="150" rx="10" fill="currentColor" fill-opacity="0.16"/>
      <circle cx="80" cy="66" r="26" fill="currentColor" fill-opacity="0.55"/>
      <path d="M32 162 C34 120 54 100 80 100 C106 100 126 120 128 162 Z" fill="currentColor" fill-opacity="0.55"/>
      <rect x="12" y="176" width="88" height="10" rx="5" fill="#f4f4f8" fill-opacity="0.75"/>
      <rect x="12" y="194" width="58" height="8" rx="4" fill="#c0c4d3" fill-opacity="0.45"/>
      <circle cx="136" cy="198" r="9" fill="currentColor"/>
      <rect x="0" y="0" width="160" height="224" rx="16" fill="url(#shine)"/>
    </symbol>
    <linearGradient id="legend-art" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7d27d" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ff5fa2" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7c4dff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- The legendary card: same layout with a richer face. -->
    <symbol id="legendary" viewBox="0 0 160 224" overflow="visible">
      <rect x="0" y="0" width="160" height="224" rx="16" fill="url(#card-body)" stroke="#f7d27d" stroke-width="3"/>
      <rect x="12" y="12" width="136" height="150" rx="10" fill="url(#legend-art)"/>
      <circle cx="80" cy="66" r="26" fill="#ffe6a8"/>
      <path d="M32 162 C34 120 54 100 80 100 C106 100 126 120 128 162 Z" fill="#ffe6a8"/>
      <path d="M58 42 L55 20 L68 31 L80 14 L92 31 L105 20 L102 42 Z" fill="#f7d27d" stroke="#08080d" stroke-opacity="0.35" stroke-width="1.5" stroke-linejoin="round"/>
      <rect x="12" y="176" width="88" height="10" rx="5" fill="#f4f4f8" fill-opacity="0.9"/>
      <rect x="12" y="194" width="58" height="8" rx="4" fill="#f7d27d" fill-opacity="0.6"/>
      <circle cx="136" cy="198" r="9" fill="#f7d27d"/>
      <rect x="0" y="0" width="160" height="224" rx="16" fill="url(#shine)"/>
    </symbol>
    <symbol id="spark" viewBox="-10 -10 20 20" overflow="visible">
      <path d="M0 -10 C1.2 -2.4 2.4 -1.2 10 0 C2.4 1.2 1.2 2.4 0 10 C-1.2 2.4 -2.4 1.2 -10 0 C-2.4 -1.2 -1.2 -2.4 0 -10 Z" fill="currentColor"/>
    </symbol>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="400" fill="#08080d"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glow-teal)"/>
    <rect width="1280" height="400" fill="url(#glow-pink)"/>
    <rect width="1280" height="400" fill="url(#glow-violet)"/>

    <!-- Wordmark -->
    <text x="84" y="128" fill="#a68bff" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="4">OPEN-SOURCE CARD GAME</text>
    <text x="78" y="232" fill="url(#word)" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="112" font-weight="800" letter-spacing="-3">Bakufu</text>
    <text x="84" y="280" fill="#c0c4d3" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25">Open packs. Collect your favorite characters.</text>
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
      <rect x="84" y="308" width="122" height="32" rx="16" fill="#a68bff" fill-opacity="0.14" stroke="#a68bff" stroke-opacity="0.45"/>
      <text x="145" y="329" fill="#e4dcff" text-anchor="middle">Self-hosted</text>
      <rect x="216" y="308" width="150" height="32" rx="16" fill="#5eead4" fill-opacity="0.10" stroke="#5eead4" stroke-opacity="0.40"/>
      <text x="291" y="329" fill="#c9f7ef" text-anchor="middle">Discord sign-in</text>
      <rect x="376" y="308" width="176" height="32" rx="16" fill="#ff5fa2" fill-opacity="0.10" stroke="#ff5fa2" stroke-opacity="0.40"/>
      <text x="464" y="329" fill="#ffd3e6" text-anchor="middle">Realms &amp; trading</text>
    </g>

    <!-- Card fan: common, uncommon, rare, epic, legendary (front) -->
    <g transform="translate(870 96)">
      <g transform="rotate(-30 80 470)" color="#8f9bbf" opacity="0.9"><use href="#card" width="160" height="224"/></g>
      <g transform="rotate(30 80 470)" color="#f18cb4" opacity="0.9"><use href="#card" width="160" height="224"/></g>
      <g transform="rotate(-15 80 470)" color="#68c9cc"><use href="#card" width="160" height="224"/></g>
      <g transform="rotate(15 80 470)" color="#b58aee"><use href="#card" width="160" height="224"/></g>
    </g>
    <rect x="760" y="20" width="380" height="380" fill="url(#glow-gold)"/>
    <rect x="866" y="78" width="168" height="232" rx="20" fill="#f7d27d" fill-opacity="0.55" filter="url(#halo)"/>
    <g transform="translate(870 82)">
      <use href="#legendary" width="160" height="224"/>
    </g>

    <!-- Sparkles -->
    <g color="#f7d27d">
      <use href="#spark" x="1046" y="78" width="22" height="22"/>
      <use href="#spark" x="842" y="300" width="14" height="14"/>
    </g>
    <g color="#e0d4ff">
      <use href="#spark" x="1150" y="150" width="16" height="16"/>
      <use href="#spark" x="742" y="118" width="12" height="12"/>
      <use href="#spark" x="1212" y="300" width="10" height="10"/>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
